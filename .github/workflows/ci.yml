# CI of tasks.nvim.
#
# Pushes to main run on a self-hosted runner (the maintainer's local Windows machine) by choice. Without a running
# runner a push stays "Queued" (no red mark, discarded after 24 h).
# Only `push` to main triggers this workflow; there is deliberately no `pull_request`/`pull_request_target` trigger:
# a pull request from a fork would otherwise run its own workflow code on the maintainer's machine. Pull requests run
# the same pipeline on GitHub-hosted runners instead (pr.yml). Windows only: the Linux and macOS legs of the former
# matrix are gone.
#
# The tools (nvim, stylua, luacheck, node) are expected on the runner's PATH and are not pinned here (the hosted jobs
# pinned stylua 2.5.2 and luacheck 1.2.0); every job prints the versions it used.

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` resolves to the WSL launcher on this machine; Git Bash is named explicitly, in 8.3 form because the
# shell string is split at spaces.
defaults:
  run:
    shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}

jobs:
  stylua:
    name: stylua (format check)
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: stylua --version && stylua --check .

  luacheck:
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: luacheck --version | head -n1 && luacheck lua TESTS scripts

  tests:
    name: specs (windows)
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # lib.nvim is a hard runtime dependency; TESTS/run.lua finds it in .deps/lib.nvim.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # The dashboard specs drive the real Snacks picker; without it they would pass with no assertion.
      - uses: actions/checkout@v5
        with:
          repository: folke/snacks.nvim
          path: .deps/snacks.nvim
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/testing.nvim
          path: .deps/testing.nvim
          ref: ci-verified
      - run: nvim --version | head -n1
      - run: bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
        env:
          TASKS_REQUIRE_SNACKS: "1"
      - name: Conformance gate
        env:
          TASKS_REQUIRE_SNACKS: "1"
        run: bash scripts/test.sh conformance
      # The IR is what a reporter or a person reads to find out WHICH case failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-windows
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14

  # The contract tasks-export/1 seen from outside: the golden documents against the JSON Schema (Ajv, strict), the
  # documents that must be refused, the rules for a reader, and the generated TypeScript types.
  contract:
    name: contract (schema, golden files, types)
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: node --version && npm ci
        working-directory: contract
      - run: node check.mjs
        working-directory: contract
