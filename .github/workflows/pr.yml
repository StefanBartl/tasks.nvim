# Pull-request CI of tasks.nvim, on GitHub-hosted runners.
#
# Pushes to main run on the author's self-hosted runner (ci.yml). A pull request -- above all one from a fork -- must
# never reach that machine, so it runs here instead: a throwaway GitHub VM, a read-only token, no secrets (every
# dependency is a public repository). It is the same pipeline, not a second one: `scripts/ci.sh` runs the `ci`
# section of .testing.lua with `testing ci`, exactly as ci.yml, the pre-push hook and `:Testing ci` do. The tool
# versions are pinned to what the self-hosted runner has (nvim 0.12.2, stylua 2.5.2, luacheck 1.2.0); a difference
# between the two is a finding, not a second pipeline to maintain.
#
# A fork can edit this file in its pull request (e.g. `runs-on: self-hosted`). The repository therefore requires
# approval before a workflow of an outside contributor runs; never approve a pull request that touches `.github/`.

name: PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: testing ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One platform failing must not cancel the other.
      fail-fast: false
      matrix:
        include:
          # The whole `full` profile: stylua, luacheck, suite, conformance.
          - os: ubuntu-latest
            steps: ""
          # Windows is what the self-hosted runner is; stylua and luacheck do not depend on the platform.
          - os: windows-latest
            steps: "--step=suite,conformance"
    defaults:
      run:
        # One shell on both platforms (Git Bash on the Windows image); scripts/ci.sh is a bash script.
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Found by scripts/test.sh in `.deps/<name>`. lib.nvim and testing.nvim come from the branch that only moves
      # once the dependency's own CI is green.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: WKDSteve/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      # The dashboard specs drive the real Snacks picker; without it they would pass with no assertion.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: folke/snacks.nvim
          path: .deps/snacks.nvim
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          repository: WKDSteve/testing.nvim
          path: .deps/testing.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: v0.12.2
      # The action installs stylua on PATH; `--version` only proves it is there, the check itself is the pipeline's.
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5
        if: matrix.steps == ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --version
      # PUC Lua, not "luajit-2.1" (that tarball 404s); `std = "luajit"` in .luacheckrc decides what is checked against.
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        if: matrix.steps == ''
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6
        if: matrix.steps == ''
      - if: matrix.steps == ''
        run: luarocks install luacheck 1.2.0
      - name: scripts/ci.sh ${{ matrix.steps }}
        env:
          TASKS_REQUIRE_SNACKS: "1"
        run: |
          nvim --version | head -n1
          exec > >(tee -a "$RUNNER_TEMP/ci-output.log") 2>&1
          bash scripts/ci.sh ${{ matrix.steps }} --keep-going --no-agent --json="$RUNNER_TEMP/ci-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ci-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ci-report.json
            ${{ runner.temp }}/ci-output.log
          if-no-files-found: ignore
          retention-days: 14

  # The contract tasks-export/1 seen from outside: the golden documents against the JSON Schema (Ajv, strict), the
  # documents that must be refused, the rules for a reader, and the generated TypeScript types. Same as in ci.yml.
  contract:
    name: contract (schema, golden files, types)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: node --version && npm ci
        working-directory: contract
      - run: node check.mjs
        working-directory: contract
