syntax = "LuaJIT"

# Wrap lines around this width; StyLua treats it as a guideline, not a hard limit.
#column_width = 120
column_width = 100

# Use LF line endings (recommended on macOS/Linux and for cross-platform repos).
line_endings = "Unix"

indent_type = "Spaces"
indent_width = 2

# Prefer double quotes but automatically switch when escaping would be worse.
quote_style = "AutoPreferDouble"  # AutoPreferDouble, AutoPreferSingle, ForceDouble, ForceSingle

# Omit parentheses when Lua allows it (single string/table argument calls).
# Alternatives: "Always", "NoSingleString", "NoSingleTable", "Input".
#call_parentheses = "None"

# # Keep simple statements multi-line unless explicitly opting in below.
#collapse_simple_statement = "Always" # Never, FunctionOnly, ConditionalOnly, Always

# # Do not insert spaces between function names and opening parens.
#äspace_after_function_names = "Never"

# # Do not preserve leading/trailing blank lines around blocks by default.
# block_newline_gaps = "Never"

# # Optional: enable require sorting for consistent import blocks.
#[sort_requires]
#enabled = true

